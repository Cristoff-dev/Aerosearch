name: AeroSearch CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create CI env file
        run: cp apps/api/.env.example apps/api/.env

      - name: Start local infrastructure (Docker)
        run: docker compose up -d
        
      - name: Wait for services readiness
        run: sleep 10

      - name: Apply Prisma database migrations
        run: pnpm --filter ./apps/api exec prisma db push --accept-data-loss
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/aerosearch?schema=public"

      - name: Execute E2E Tests
        run: pnpm --filter ./apps/api run test:ci
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/aerosearch?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          TYPESENSE_HOST: "127.0.0.1"
          TYPESENSE_PORT: "8108"
          TYPESENSE_PROTOCOL: "http"
          TYPESENSE_API_KEY: "tu_api_key_de_prueba"

      - name: Teardown local infrastructure
        if: always()
        run: docker compose down

  publish-image:
    name: Publish Docker Image
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/aerosearch-api

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max